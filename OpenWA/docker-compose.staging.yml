services:
  caddy:
    image: caddy:2.10-alpine
    container_name: openwa-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      OPENWA_DOMAIN: '${OPENWA_DOMAIN:?OPENWA_DOMAIN is required}'
      OPENWA_IP: '${OPENWA_IP:?OPENWA_IP is required}'
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      openwa-api:
        condition: service_healthy

  openwa-api:
    ports: !override
      - '127.0.0.1:${API_PORT:-2785}:2785'
    environment:
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_SYNCHRONIZE: 'false'
      DATABASE_SSL: '${DATABASE_SSL:-false}'
      DATABASE_POOL_SIZE: '${DATABASE_POOL_SIZE:-10}'
      SESSION_DATA_PATH: /app/data/sessions
      ENABLE_SWAGGER: 'false'
      DASHBOARD_ENABLED: '${DASHBOARD_ENABLED:-false}'
      CORS_ORIGINS: '${CORS_ORIGINS:-debtledger://}'
      QUEUE_ENABLED: '${QUEUE_ENABLED:-false}'
    depends_on:
      postgres:
        condition: service_healthy
        required: true

# Base compose defines persistent postgres-data and openwa-data volumes. Caddy
# is the only public entry point; the raw API stays on loopback.

volumes:
  caddy-data:
  caddy-config:

services:
  openwa-api:
    ports: !override
      - '127.0.0.1:${API_PORT:-2785}:2785'
    environment:
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_SYNCHRONIZE: 'false'
      DATABASE_SSL: '${DATABASE_SSL:-false}'
      DATABASE_POOL_SIZE: '${DATABASE_POOL_SIZE:-10}'
      SESSION_DATA_PATH: /app/data/sessions
      ENABLE_SWAGGER: 'false'
      DASHBOARD_ENABLED: 'false'
      CORS_ORIGINS: '${CORS_ORIGINS:-debtledger://}'
      QUEUE_ENABLED: '${QUEUE_ENABLED:-false}'
    depends_on:
      postgres:
        condition: service_healthy
        required: true

# Base compose defines persistent postgres-data and openwa-data volumes. The raw
# API stays on loopback; terminate public TLS in a host proxy or private tunnel.

project_id = "muthbat-staging"

[auth]
site_url = "debtledger://login-callback"
additional_redirect_urls = ["debtledger://login-callback"]
jwt_expiry = 900
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enabled = false
enable_signup = false

# Account creation is performed only by the WhatsApp OTP Edge Function using the
# service role. Native GoTrue phone signup/OTP stays disabled; the resulting
# confirmed user can still obtain a normal phone/password session.
[auth.sms]
enable_signup = false
enable_confirmations = true

# Native SMS delivery is not used; WhatsApp OTP is handled exclusively by the
# two Edge Functions. This also prevents old local Twilio placeholders from
# being treated as a hosted provider.
[auth.sms.twilio_verify]
enabled = false

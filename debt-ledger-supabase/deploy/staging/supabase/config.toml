project_id = "muthbat-staging"

[auth]
site_url = "debtledger://login-callback"
additional_redirect_urls = ["debtledger://login-callback"]
jwt_expiry = 900
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enabled = false
enable_signup = false

# Account creation is performed by the OTP Edge Function using the service role.
# The resulting confirmed user obtains a normal password session; GoTrue itself
# never sends the WhatsApp message.
[auth.sms]
enable_signup = true
enable_confirmations = true

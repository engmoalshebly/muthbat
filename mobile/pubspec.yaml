name: muthbat
description: "منصة مُثبَت | MUTHBAT - لتوثيق وإدارة المعاملات المالية والديون"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^2.6.1

  # Backend & Network
  supabase_flutter: ^2.18.3
  http: ^1.2.2
  http_parser: ^4.1.2

  # UI, Typography & Animations
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  flutter_animate: ^4.5.2
  cupertino_icons: ^1.0.8

  # Local Database, Cache & Offline Sync
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.1.1
  cryptography: ^2.9.0
  local_auth: ^3.0.2
  path: ^1.9.1
  shared_preferences: ^2.5.4
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4

  # Utilities
  meta: ^1.15.0
  intl: ^0.20.2
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  lucide_icons_flutter: ^3.1.15
  flutter_contacts: 2.1.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  file_saver: ^0.3.1
  crypto: ^3.0.7
  pdf: ^3.12.0
  file_picker: ^12.2.0
  workmanager: ^0.10.10
  printing: ^5.14.3
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: 22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: ZaridSlab
      fonts:
        - asset: assets/fonts/29LTZaridSlab-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/29LTZaridSlab-Light.ttf
          weight: 300
        - asset: assets/fonts/29LTZaridSlab-Regular.ttf
          weight: 400
        - asset: assets/fonts/29LTZaridSlab-Medium.ttf
          weight: 500
        - asset: assets/fonts/29LTZaridSlab-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/29LTZaridSlab-Bold.ttf
          weight: 700
        - asset: assets/fonts/29LTZaridSlab-Black.ttf
          weight: 900

  assets:
    - assets/fonts/
    - assets/logos/brand_app_icon.png
    - assets/logos/brand_horizontal_ar.png
    - assets/logos/brand_horizontal_monochrome.png
    - assets/logos/brand_horizontal_white.png
    - assets/logos/brand_mark.png
    - assets/logos/brand_mark_monochrome.png
    - assets/logos/brand_mark_spacious.png
    - assets/logos/brand_mark_white.png
    - assets/logos/brand_vertical_ar.png
    - assets/logos/brand_vertical_white.png
    - assets/icons/
    - assets/images/

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" fill="none">
  <defs>
    <linearGradient id="goldW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE19B"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </linearGradient>
  </defs>

  <!-- Left/RTL Icon Group (X: 300 to 400) -->
  <g transform="translate(300, 0)">
    <!-- Document 1 -->
    <rect x="10" y="18" width="40" height="64" rx="7" fill="#FFFFFF" fill-opacity="0.2"/>
    <!-- Document 2 -->
    <rect x="32" y="30" width="40" height="68" rx="7" fill="#138577"/>
    <!-- Accents -->
    <rect x="18" y="28" width="16" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.6"/>
    <rect x="46" y="82" width="16" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.6"/>
    <!-- Golden Seal Checkmark -->
    <circle cx="41" cy="55" r="18" fill="#123B46"/>
    <circle cx="41" cy="55" r="15" fill="#0C2931"/>
    <path d="M33 55 L38.5 60.5 L49.5 48.5" stroke="url(#goldW)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography Group (White Version) -->
  <text x="280" y="65" font-family="'IBM Plex Sans Arabic', 'Tajawal', 'Cairo', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="end">مُثبَت</text>
  <text x="280" y="88" font-family="'Manrope', 'Montserrat', 'Helvetica', sans-serif" font-size="14" font-weight="700" letter-spacing="4.5" fill="#1FB2A0" text-anchor="end">MUTHBAT</text>
  <circle cx="288" cy="84" r="3" fill="#D9A441"/>
  <text x="280" y="106" font-family="'Tajawal', 'Cairo', sans-serif" font-size="11" font-weight="500" fill="#B2C5C8" text-anchor="end">كل حق.. مُثبَت.</text>
</svg>
